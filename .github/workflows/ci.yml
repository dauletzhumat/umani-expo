name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  domain:
    # Blocking: the finance engine (src/domain) must stay type-safe, lint-clean,
    # framework-free and ≥ 95% covered (CLAUDE.md, "Testing").
    name: Domain (typecheck, lint, tests)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 26
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck src/domain
        run: npm run typecheck:domain

      - name: Lint src/domain
        run: npm run lint:domain

      - name: Boundary check + tests with coverage threshold
        run: npm run test:coverage -- --ci

  app:
    # Non-blocking until Milestone 1c removes the Expo template code, which has
    # known typecheck and lint errors. Make this blocking at the end of M1c.
    name: Whole app (typecheck, lint) — non-blocking until M1c
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 26
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint
