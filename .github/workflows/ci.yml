name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  domain:
    # Blocking: the finance engine (src/domain) must stay type-safe, lint-clean,
    # framework-free and ≥ 95% covered (CLAUDE.md, "Testing").
    name: Domain (typecheck, lint, tests)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck src/domain
        run: npm run typecheck:domain

      - name: Lint src/domain
        run: npm run lint:domain

      - name: Boundary check + tests with coverage threshold
        run: npm run test:coverage -- --ci

  database:
    # Blocking: migrations apply cleanly on a fresh local Postgres and every pgTAP test passes,
    # including SQL/TypeScript parity on the shared fixtures. No cloud resources are used.
    name: Database (migrations, pgTAP)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      # The Supabase CLI is a pinned devDependency, so CI and local runs use the same version.
      - name: Install dependencies
        run: npm ci

      - name: Fixture parity test is up to date
        run: |
          npm run db:fixtures
          git diff --exit-code supabase/tests/900_fixture_parity.test.sql

      - name: Start local Postgres and apply migrations
        run: npx supabase db start

      - name: pgTAP
        run: npx supabase test db

  app:
    # Blocking since M1c removed the Expo template: the whole project typechecks and lints clean.
    name: Whole app (typecheck, lint)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint
